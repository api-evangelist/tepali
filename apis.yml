aid: tepali
name: Tepali
description: Tepali is an AI-native operating system for medical spas and aesthetic and
  wellness practices. It replaces fragmented point solutions with a single system of record,
  combining marketing intelligence, online scheduling, team management, patient CRM, clinical
  charting, and inventory. AI agents handle front-desk phone calls around the clock, generate
  real-time patient documentation such as SOAP notes, treatment summaries, and consent forms,
  and convert inbound leads into booked appointments. Founded in 2026 and backed by Y Combinator
  (W26), the company is headquartered in New York City. Tepali currently ships a hosted web
  application at app.tepali.com and does not publish a public developer API, SDKs, or documentation.
